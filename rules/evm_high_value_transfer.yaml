id: community-evm-high-value-transfer
name: "EVM High-Value Token Transfer"
# Transfers of 1000 ETH and more raise the built-in rule tx-001 ("Large ETH
# Transfer", also a kill chain stage) instead, so a transfer raises one alert.
description: "Detects token transfers of more than 500 and less than 1000 ETH in value (1000 ETH and more: tx-001), which may indicate fund draining or large unauthorized withdrawals."
type: threshold
enabled: true
severity: 8
category: "Fund Movement"
tags:
  - evm
  - high-value
  - fund-movement
mitre:
  tactic_id: "TA0010"
  tactic_name: "Exfiltration"
  technique_id: "T1041"
conditions:
  match:
    - field: action
      operator: eq
      value: "evm.transaction"
    - field: metadata.value_eth
      operator: gt
      value: 500
    - field: metadata.value_eth
      operator: lt
      value: 1000
threshold:
  count: 1
  operator: gte
window: 5m
group_by:
  - metadata.from
