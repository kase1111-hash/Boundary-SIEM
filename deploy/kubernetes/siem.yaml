# Boundary SIEM Kubernetes Deployment
#
# One siem-ingest replica (correlation state and alert deduplication live in
# the process) backed by an existing ClickHouse service. The image is built
# from deploy/container/Dockerfile.
#
#   kubectl apply -f deploy/kubernetes/siem.yaml
#   kubectl -n boundary-siem create secret generic siem-secrets \
#     --from-literal=api-key=<api key> --from-literal=clickhouse-password=<password> \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Adjust CLICKHOUSE_HOST below to your ClickHouse service (native port 9000).

---
apiVersion: v1
kind: Namespace
metadata:
  name: boundary-siem
  labels:
    name: boundary-siem
    # Pod Security Standards - Restricted (same labels as
    # deploy/container/pod-security-policy.yaml)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: siem
  namespace: boundary-siem
automountServiceAccountToken: false

---
# Mounted over the image's /app/configs. Relative paths are resolved from
# the working directory /app. Environment variables in the Deployment
# override these values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: siem-config
  namespace: boundary-siem
data:
  config.yaml: |
    server:
      http_port: 8080
      shutdown_timeout: 8s      # below terminationGracePeriodSeconds
    ingest:
      cef:
        tcp:
          enabled: true
          address: ":5515"
          tls_enabled: false    # mount certificates into /app/certs and enable for production
        udp:
          enabled: false
        dtls:
          enabled: false
    auth:
      enabled: true             # keys come from SIEM_API_KEY
    storage:
      enabled: true
      clickhouse:
        database: siem
        tls_enabled: false
    correlation:
      rules_dir: data/rules
      seed_rules_dir: rules
    websocket:
      enabled: true

---
# Replace the placeholder values (or create the secret as shown above).
apiVersion: v1
kind: Secret
metadata:
  name: siem-secrets
  namespace: boundary-siem
type: Opaque
stringData:
  api-key: ""
  clickhouse-password: ""

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: siem-data
  namespace: boundary-siem
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi              # custom rules and overrides only; events live in ClickHouse

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siem
  namespace: boundary-siem
  labels:
    app: siem
spec:
  replicas: 1
  strategy:
    type: Recreate              # never run two instances against the same data
  selector:
    matchLabels:
      app: siem
  template:
    metadata:
      labels:
        app: siem
        app.kubernetes.io/name: boundary-siem
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: siem
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: siem
        image: boundary-siem:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: cef-tcp
          containerPort: 5515
        env:
        - name: SIEM_API_KEY
          valueFrom:
            secretKeyRef:
              name: siem-secrets
              key: api-key
        - name: CLICKHOUSE_HOST
          value: "clickhouse.clickhouse.svc.cluster.local:9000"
        - name: CLICKHOUSE_USER
          value: "siem"
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: siem-secrets
              key: clickhouse-password
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /health        # 200 while the process serves requests
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready         # 503 while shutting down, backlogged, or storage is down
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: siem-config
      - name: data
        persistentVolumeClaim:
          claimName: siem-data
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: siem
  namespace: boundary-siem
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: cef-tcp
    port: 5515
    targetPort: cef-tcp
  selector:
    app: siem

---
# HTTP API and dashboard behind an ingress controller. The WebSocket stream
# (/ws/events) needs an ingress that passes Upgrade headers (ingress-nginx does).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siem
  namespace: boundary-siem
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"   # ingest.max_payload_size
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - siem.example.com
    secretName: siem-tls
  rules:
  - host: siem.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: siem
            port:
              name: http

---
# NetworkPolicy: least-privilege network access for the SIEM pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: siem-network-policy
  namespace: boundary-siem
spec:
  podSelector:
    matchLabels:
      app: siem
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP API (events, search, alerts, rules, /ws/events, probes, /metrics)
    # and CEF over TCP
    - ports:
        - port: 8080
          protocol: TCP
        - port: 5515
          protocol: TCP
  egress:
    # ClickHouse native protocol
    - ports:
        - port: 9000
          protocol: TCP
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Notification channels (webhook, Slack, Discord, PagerDuty, Telegram, SMTP)
    # and EVM RPC endpoints
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - port: 443
          protocol: TCP
        - port: 587
          protocol: TCP
        - port: 465
          protocol: TCP
