# Kubernetes Network Policies for Boundary-SIEM
# Default-deny for the namespace and an optional policy for an in-namespace
# ClickHouse. The siem-ingest policy (siem-network-policy: ingress 8080/5515,
# egress ClickHouse 9000, DNS, HTTPS/SMTP) is in deploy/kubernetes/siem.yaml;
# apply both:
#
#   kubectl apply -f deploy/kubernetes/siem.yaml -f deploy/container/network-policy.yaml
#
# Prerequisites:
#   - Kubernetes cluster with NetworkPolicy support (Calico, Cilium, etc.)
#   - Namespace boundary-siem (created by deploy/kubernetes/siem.yaml)

# =============================================================================
# Default Deny All - Baseline security
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: boundary-siem
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# =============================================================================
# ClickHouse in the same namespace (optional): only siem-ingest may connect
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-policy
  namespace: boundary-siem
spec:
  podSelector:
    matchLabels:
      app: clickhouse
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: siem
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
