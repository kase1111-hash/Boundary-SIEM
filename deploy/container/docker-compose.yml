# Boundary-SIEM Docker Compose Configuration
# siem-ingest + ClickHouse with network isolation and container hardening
#
# Usage (from the repository root):
#   export SIEM_API_KEY=<api key> CLICKHOUSE_PASSWORD=<password>
#   docker compose -f deploy/container/docker-compose.yml up -d --build
#   docker compose -f deploy/container/docker-compose.yml logs -f siem
#   docker compose -f deploy/container/docker-compose.yml down
#
# Then:
#   curl -s http://localhost:8080/ready
#   curl -s -H "X-API-Key: $SIEM_API_KEY" http://localhost:8080/v1/alerts
#
# Security features:
#   - ClickHouse only on an internal network (no published ports, no egress)
#   - Read-only root filesystem, no new privileges, all capabilities dropped
#   - Non-root user, resource limits
#   - Optional seccomp/AppArmor profiles (see below)

name: boundary-siem

# =============================================================================
# Networks
# =============================================================================
networks:
  # Internal network - siem <-> ClickHouse, no external access
  siem-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

  # Ingestion network - published HTTP API and CEF ports
  siem-ingestion:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24

# =============================================================================
# Volumes
# =============================================================================
volumes:
  siem-data:          # /app/data: custom rules and rule overrides (correlation.rules_dir)
  clickhouse-data:
  clickhouse-logs:

# =============================================================================
# Services
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # ClickHouse - event, quarantine and alert storage
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    restart: unless-stopped
    networks:
      - siem-internal
    environment:
      - CLICKHOUSE_USER=siem
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # siem-ingest
  # ---------------------------------------------------------------------------
  siem:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
      target: runtime
    image: boundary-siem:latest
    restart: unless-stopped

    # siem-ingest exits at startup if ClickHouse is unreachable
    depends_on:
      clickhouse:
        condition: service_healthy

    networks:
      - siem-internal
      - siem-ingestion

    ports:
      - "8080:8080"         # HTTP API, /health, /ready, /metrics, /ws/events
      - "5515:5515/tcp"     # CEF over TCP
      # - "5516:5516/udp"   # CEF over DTLS (set ingest.cef.dtls.enabled and mount certs)
      # - "5514:5514/udp"   # CEF over plain UDP (unencrypted; disabled by default)

    # The image's configs/config.yaml is used; these override it.
    environment:
      - TZ=UTC
      - SIEM_LOG_LEVEL=info
      - SIEM_API_KEY=${SIEM_API_KEY:?set SIEM_API_KEY}
      - SIEM_STORAGE_ENABLED=true
      - CLICKHOUSE_HOST=clickhouse:9000
      - CLICKHOUSE_USER=siem
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      - SIEM_SHUTDOWN_TIMEOUT=8s

    volumes:
      - siem-data:/app/data:rw
      # Custom configuration:
      # - ./config.yaml:/app/configs/config.yaml:ro
      # TLS certificates for CEF TCP/DTLS:
      # - ./certs:/app/certs:ro

    # Security configuration
    security_opt:
      - no-new-privileges:true
      # Optional hardening; load the profiles on the host first
      # (sudo deploy/container/setup-container-isolation.sh docker):
      # - seccomp=deploy/container/seccomp-profile.json
      # - apparmor=boundary-siem

    cap_drop:
      - ALL
    # cap_add:
    #   - NET_BIND_SERVICE   # only needed to listen on ports below 1024

    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777,noexec,nosuid

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Keep above server.shutdown_timeout so the queue drains before SIGKILL
    stop_grace_period: 15s

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
